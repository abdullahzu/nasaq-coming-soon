name: Browser review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit chrome msedge
      - run: npm run test:browsers
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasaq-browser-review
          path: |
            playwright-report/
            test-results/
          retention-days: 14
