name: Validate NASAQ

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use locked Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Confirm repository root
        run: test -f package.json && test -f package-lock.json && test -f wrangler.jsonc

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests and Cloudflare dry deployment
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm run verify
